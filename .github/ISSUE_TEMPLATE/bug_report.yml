name: Bug report
description: Report a rendering, compatibility, or loading problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Quark Framed Glass CT.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Minecraft, NeoForge, Quark, Zeta, Fusion, and add-on versions.
      placeholder: Minecraft 1.21.1; NeoForge 21.1.234; Quark 4.1-480; Zeta 1.1-40; Fusion 1.3.2+b; add-on 0.2.2
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the layout, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot and log
      description: Attach screenshots and paste the relevant latest.log excerpt or a link to it.
    validations:
      required: true
